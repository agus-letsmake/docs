    # ---------------------------------------------------------------------------
    # Quality API v1 — shared machine schemas.
    #
    # `GET /api/quality/v1/context` is implemented. Remaining quality/v1 routes
    # and MachineClient scopes are still forward contract. Keep these schemas
    # aligned with `src/lib/quality-api/` and the MCP adapter.
    # ---------------------------------------------------------------------------

    QualityV1RequestId:
      type: string
      description: |
        Correlation identifier echoed on every quality API response and error, and logged with
        tool name, duration, status code, and retry count.
        Source: `research/mcp-server/transport-and-agent-ux.md` (Output conventions, Logging and observability).

    QualityV1ProjectContext:
      type: object
      description: |
        Bound project identity returned by `GET /api/quality/v1/context`.
        One project is bound per client process; individual calls cannot override it.
        Source: `research/mcp-server/auth-tenancy-safety.md` (Project binding, Authorization mapping)
        and `research/mcp-server/mcp-tool-catalog.md` (`testlab_get_context`).
      required:
        - projectId
        - projectName
        - projectSlug
        - archived
        - role
        - scope
        - apiVersion
        - requestId
        - machineScopes
      properties:
        projectId:
          type: string
        projectName:
          type: string
        projectSlug:
          type: string
        archived:
          type: boolean
        role:
          $ref: "#/components/schemas/ProjectRole"
        scope:
          $ref: "#/components/schemas/ApiKeyScope"
        apiVersion:
          type: string
          description: TestLab quality API version the server implements
        requestId:
          $ref: "#/components/schemas/QualityV1RequestId"
        machineScopes:
          type: array
          items:
            type: string
          description: |
            MachineClient scopes. Empty until MCP Task 3 (project-scoped machine credentials).
            ApiKey binding is reported in `scope` (`global` | `project`).

    QualityV1ListEnvelope:
      type: object
      description: |
        Bounded list response. Default page size 25, maximum 100; `hasMore` is always present and
        clients must not auto-fetch every page.
        Source: `research/mcp-server/transport-and-agent-ux.md` (Output conventions, Pagination and
        query limits) and GAP-13 in `research/mcp-server/api-gaps.md`.
      required:
        - projectId
        - requestId
        - data
        - page
        - limit
        - total
        - hasMore
      properties:
        projectId:
          type: string
        requestId:
          $ref: "#/components/schemas/QualityV1RequestId"
        data:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        total:
          type: integer
        hasMore:
          type: boolean

    QualityV1MutationEnvelope:
      type: object
      description: |
        Bounded mutation response carrying tenant identity, audit linkage, and idempotent-replay state.
        Source: `research/mcp-server/transport-and-agent-ux.md` (Output conventions).
      required:
        - projectId
        - requestId
        - data
      properties:
        projectId:
          type: string
        requestId:
          $ref: "#/components/schemas/QualityV1RequestId"
        data:
          type: object
          properties:
            id:
              type: string
            updatedAt:
              type: string
              format: date-time
        auditEventId:
          type: string
        idempotentReplay:
          type: boolean

    QualityV1ErrorCode:
      type: string
      description: |
        Stable machine error codes. HTTP status text is not the agent contract.
        Source: `research/mcp-server/transport-and-agent-ux.md` (Error contract) and GAP-04.
        Task 6 implements this exact list in `src/lib/quality-api/errors.ts`.
      enum:
        - AUTHENTICATION_FAILED
        - PROJECT_SCOPE_MISMATCH
        - PERMISSION_DENIED
        - INSUFFICIENT_SCOPE
        - VALIDATION_FAILED
        - NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - CONFIRMATION_REQUIRED
        - CONFIRMATION_EXPIRED
        - RATE_LIMITED
        - UPSTREAM_UNAVAILABLE
        - PARTIAL_DISPATCH
        - FILE_OUTSIDE_WORKDIR
        - EVIDENCE_REJECTED
        - UNKNOWN_DOMAIN_VALUE
        - API_VERSION_UNSUPPORTED
        - TASK_EXPIRED
        - TASK_CANCELLED

    QualityV1Error:
      type: object
      description: |
        Error body used by every quality API failure.
        Source: `research/mcp-server/transport-and-agent-ux.md` (Error contract).
      required:
        - code
        - message
        - retryable
        - requestId
      properties:
        code:
          $ref: "#/components/schemas/QualityV1ErrorCode"
        message:
          type: string
        retryable:
          type: boolean
        requestId:
          $ref: "#/components/schemas/QualityV1RequestId"
        details:
          type: object
          description: Code-specific structured context, for example `entityId` and `currentUpdatedAt`
        suggestedAction:
          type: string
          description: Recovery instruction the agent can act on

    QualityV1ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/QualityV1Error"

  responses:
    UnauthorizedError:
      description: Authentication required or rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Missing authentication. Provide either X-API-Key header or Authorization: Bearer <token>"

    ForbiddenError:
      description: Authenticated but not permitted for this project or role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ConflictError:
      description: Conflicts with an existing record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    GoneError:
      description: Resource exists but is no longer available
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              availability:
                $ref: "#/components/schemas/ArtifactAvailability"

    UnprocessableEntityError:
      description: Semantically invalid for the target provider
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailableError:
      description: A required integration is not configured on this instance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
