        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automated-results/start:
    post:
      summary: Start an automated execution
      description: Creates (or resumes) an automated execution and seeds `todo` results.
      operationId: startAutomatedExecution
      tags:
        - Automated Results
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomatedResultsStartInput"
      responses:
        "200":
          description: Started execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomatedResultsStartResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automated-results/reconcile:
    post:
      summary: Reconcile stale automated executions
      description: |
        Closes automated executions that stopped reporting. With `executionId` and `force: true`
        the stale-window check is skipped so CI can close a known orphan immediately.
      operationId: reconcileAutomatedResults
      tags:
        - Automated Results
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomatedResultsReconcileInput"
      responses:
        "200":
          description: Reconciliation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomatedResultsReconcileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/trigger:
    post:
      summary: Trigger an automation batch
      description: |
        Dispatches one GitHub Actions workflow run per requested workflow. The request field is
        `workflowIds`, not `suiteIds`.
      operationId: triggerAutomationBatch
      tags:
        - Automations
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationTriggerInput"
      responses:
        "201":
          description: Batch dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationBatchRun"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/preflight:
    get:
      summary: Check automation readiness
      operationId: automationPreflight
      tags:
        - Automations
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Preflight result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationPreflightResult"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/batches:
    get:
      summary: List automation batches
      description: Returns `{ data }` without pagination metadata. `limit` is clamped to 1-50 and defaults to 10.
      operationId: listAutomationBatches
      tags:
        - Automations
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutomationBatchRun"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/batches/{id}:
    get:
      summary: Get an automation batch
      operationId: getAutomationBatch
      tags:
        - Automations
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Batch with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationBatchRun"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/batches/{id}/retry:
    post:
      summary: Retry failed batch items
      description: Takes no request body. Retries every failed item in the batch.
      operationId: retryAutomationBatch
      tags:
        - Automations
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Batch after retry, with retry counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationBatchRetryResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/github/callback:
    get:
      summary: GitHub App installation callback
      description: |
        Called by GitHub after an App installation. Always responds with a redirect to the
        project automation settings page; it never returns JSON. Not authenticated by
        `X-API-Key` or a bearer token — the `state` query parameter carries the project ID.
      operationId: githubInstallCallback
      tags:
        - Automations
      security: []
      parameters:
        - name: installation_id
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Project ID passed through the installation flow
        - name: setup_action
          in: query
          required: false
          schema:
            type: string
      responses:
        "307":
          description: Redirect to the project automation settings page
          headers:
            Location:
              schema:
                type: string

  /api/automations/integrations:
    get:
      summary: List automation integrations
      description: |
        With `installUrl=1` this returns a GitHub App install URL instead of the integration list.
        That variant requires the `owner` role and a configured GitHub App.
      operationId: listAutomationIntegrations
      tags:
        - Automation Integrations
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: installUrl
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: When `1`, return an install URL payload instead of the integration list
      responses:
        "200":
          description: Integration list, or install URL when `installUrl=1`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutomationIntegrationList"
                  - $ref: "#/components/schemas/GitHubInstallUrlResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create or bind an automation integration
      description: |
        Accepts either a full integration definition or a GitHub repository binding.
        Binding an existing GitHub integration updates it in place and returns `200`.
      operationId: createAutomationIntegration
      tags:
        - Automation Integrations
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AutomationIntegrationInput"
                - $ref: "#/components/schemas/GitHubRepoBindingInput"
      responses:
        "200":
          description: Existing GitHub integration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationIntegration"
        "201":
          description: Integration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationIntegration"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/UnprocessableEntityError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/integrations/{id}:
    patch:
      summary: Update an automation integration
      operationId: updateAutomationIntegration
      tags:
        - Automation Integrations
      parameters:
        - $ref: "#/components/parameters/IntegrationId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationIntegrationUpdateInput"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationIntegration"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete an automation integration
      operationId: deleteAutomationIntegration
      tags:
        - Automation Integrations
      parameters:
        - $ref: "#/components/parameters/IntegrationId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automations/mappings:
    get:
      summary: List suite automation mappings
      description: Returns `{ data }` without pagination metadata.
      operationId: listAutomationMappings
      tags:
        - Automation Mappings
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
