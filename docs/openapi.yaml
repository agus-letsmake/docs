openapi: 3.0.3
info:
  title: TestLab API
  description: |
    TestLab is a comprehensive test management system with support for manual and automated test execution.

    This API provides endpoints for managing test cases, test suites, executions, and integrating automated test results from CI/CD pipelines.

    ## Authentication

    Most API endpoints require authentication using one of two methods:
    - **API Key**: Use the `X-API-Key` header with your generated API key (recommended for CI/CD)
    - **Bearer Token**: Use the `Authorization` header with a Firebase ID token (for user sessions)

    Exceptions are documented per operation: `/api/automations/github/callback` is called by GitHub,
    `/api/cron/reconcile-executions` uses a cron secret, `/api/dev/session` uses a development secret,
    and `/api/cli/device/code` plus `/api/cli/device/token` are unauthenticated device-login endpoints
    (the CLI proves possession of the `deviceCode`).

    ## Project scoping

    Project-scoped endpoints resolve the active project from the optional `X-Project-Id` header.
    When the header is absent, the server falls back to the caller's oldest project membership.
    Machine clients should always send `X-Project-Id` explicitly.

    ## Base URL

    Production: `https://poc-test-management.vercel.app`
    Development: `http://localhost:3000`
  version: 1.1.0
  contact:
    name: TestLab Support
    email: support@letsmake.com

servers:
  - url: https://poc-test-management.vercel.app
    description: Production server
  - url: http://localhost:3000
    description: Development server

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Test Cases
    description: Manage individual test cases
  - name: Test Suites
    description: Manage collections of test cases
  - name: Executions
    description: Manage test execution runs
  - name: Automated Results
    description: Push results from automated test runners (CI/CD)
  - name: Automations
    description: GitHub App install, suite trigger batches, and preflight
  - name: Automation Integrations
    description: Provider integrations used to dispatch automated runs
  - name: Automation Mappings
    description: Suite-to-integration dispatch mappings
  - name: Projects
    description: Project records and settings
  - name: Members
    description: Project membership and roles
  - name: API Keys
    description: Manage API keys for authentication
  - name: Attachments
    description: Evidence attached to test cases and execution results
  - name: Evidence
    description: |
      Attempt-scoped observed evidence (`/api/evidence/v1/*`): immutable case attempts,
      ordered steps, and step screenshot artifacts used by the walkthrough UI and SDK.
  - name: Audit
    description: Audit log reads
  - name: Statistics
    description: Aggregated pass-rate trends and flaky test detection
  - name: Data Management
    description: Import and export test data
  - name: Reports
    description: Generate test reports
  - name: Auth
    description: User session bootstrap
  - name: CLI
    description: Setup CLI device login (browser device flow)
  - name: Development
    description: Local development helpers, disabled in production
  - name: Cron
    description: Scheduled maintenance jobs
  - name: Quality API v1
    description: |
      Versioned machine surface under `/api/quality/v1/`.

      Foundation scaffold: `GET /api/quality/v1/context` is implemented using existing
      ApiKey authentication and strict `X-Project-Id`. MachineClient credentials and
      fine-grained scopes are deferred (MCP Task 3 — schema approval). Shared component
      schemas (`QualityV1*`) remain the contract source of truth for the MCP adapter.
      See `research/mcp-server/architecture.md`.

paths:
  /api/quality/v1/context:
    get:
      summary: Get bound quality API project context
      description: |
        Returns project metadata, effective membership role, ApiKey credential scope
        (`global` | `project`), and the quality API version for the authenticated caller.

        Requires `X-Project-Id`. Does not fall back to the caller's oldest membership.
        `machineScopes` is always an empty array until MachineClient credentials ship
        (MCP Task 3). Not a product-launch MCP surface — foundation only.
      operationId: getQualityV1Context
      tags:
        - Quality API v1
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: X-Request-Id
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/QualityV1RequestId"
          description: Optional client correlation id; echoed when it matches the safe pattern
      responses:
        "200":
          description: Bound project context
          headers:
            X-Request-Id:
              schema:
                $ref: "#/components/schemas/QualityV1RequestId"
              description: Correlation id also present in the response body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityV1ProjectContext"
        "400":
          description: Missing or blank X-Project-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityV1ErrorResponse"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityV1ErrorResponse"
        "403":
          description: Project access denied, archived, or API key project scope mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityV1ErrorResponse"
        "500":
          description: Upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityV1ErrorResponse"

  /api/test-cases:
    get:
      summary: List test cases
      description: |
        Returns a paginated envelope, not a bare array. `limit` is clamped to 1-100 and defaults to 50.
      operationId: listTestCases
      tags:
        - Test Cases
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - $ref: "#/components/parameters/PageQuery"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size, clamped server-side to 1-100
      responses:
        "200":
          description: Paginated test cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseListPage"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a test case
      operationId: createTestCase
      tags:
        - Test Cases
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCaseInput"
      responses:
        "201":
          description: Created test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/test-cases/{id}:
    get:
      summary: Get a test case
      operationId: getTestCase
      tags:
        - Test Cases
      parameters:
        - $ref: "#/components/parameters/TestCaseId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Replace a test case
      description: Full update. `title` is required even though every other field is optional.
      operationId: updateTestCase
      tags:
        - Test Cases
      parameters:
        - $ref: "#/components/parameters/TestCaseId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCaseUpdateInput"
      responses:
        "200":
          description: Updated test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete a test case
      operationId: deleteTestCase
      tags:
        - Test Cases
      parameters:
        - $ref: "#/components/parameters/TestCaseId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/test-cases/resolve:
    get:
      summary: Resolve automation keys to test case IDs
      description: |
        Supply either `automationKey` (single) or `automationKeys` (comma-separated).
        Keys that do not resolve are reported in `missing` with `found: false`.
      operationId: resolveAutomationKeys
      tags:
        - Test Cases
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: automationKey
          in: query
          required: false
          schema:
            type: string
          description: A single automation key
        - name: automationKeys
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated automation keys
      responses:
        "200":
          description: Resolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationKeyResolution"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/test-suites:
    get:
      summary: List test suites
      description: Returns a paginated envelope, not a bare array. `limit` is clamped to 1-100 and defaults to 50.
      operationId: listTestSuites
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - $ref: "#/components/parameters/PageQuery"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size, clamped server-side to 1-100
      responses:
        "200":
          description: Paginated test suites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuiteListPage"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a test suite
      operationId: createTestSuite
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSuiteInput"
      responses:
        "201":
          description: Created test suite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuite"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/test-suites/{id}:
    get:
      summary: Get a test suite
      operationId: getTestSuite
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/TestSuiteId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Test suite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuite"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update a test suite
      operationId: updateTestSuite
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/TestSuiteId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSuiteUpdateInput"
      responses:
        "200":
          description: Updated test suite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuite"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete a test suite
      operationId: deleteTestSuite
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/TestSuiteId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/test-suites/{id}/test-cases:
    put:
      summary: Replace suite membership
      description: Replaces the full set of test cases in the suite.
      operationId: replaceSuiteTestCases
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/TestSuiteId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - testCaseIds
              properties:
                testCaseIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Membership replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  testCaseIds:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Add one test case to a suite
      operationId: addSuiteTestCase
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/TestSuiteId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - testCaseId
              properties:
                testCaseId:
                  type: string
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Remove one test case from a suite
      operationId: removeSuiteTestCase
      tags:
        - Test Suites
      parameters:
        - $ref: "#/components/parameters/TestSuiteId"
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: testCaseId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/executions:
    get:
      summary: List executions
      description: Returns a paginated envelope, not a bare array. `limit` is clamped to 1-100 and defaults to 20.
      operationId: listExecutions
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - $ref: "#/components/parameters/PageQuery"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size, clamped server-side to 1-100
        - name: suiteId
          in: query
          required: false
          schema:
            type: string
          description: Filter executions by originating suite
      responses:
        "200":
          description: Paginated executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecutionListPage"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a manual execution
      operationId: createExecution
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestExecutionInput"
      responses:
        "201":
          description: Created execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecution"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/executions/{id}:
    get:
      summary: Get an execution
      operationId: getExecution
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Execution with results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecution"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update an execution
      description: |
        Partial update despite the `PUT` verb. Only supplied fields are written.
        Setting `status` to `completed` stamps `completedAt`; setting it back to `in_progress` clears it.
      operationId: updateExecution
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestExecutionUpdateInput"
      responses:
        "200":
          description: Updated execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecution"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete an execution
      operationId: deleteExecution
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/executions/{id}/results:
    put:
      summary: Record one manual test result
      description: |
        Upserts a single manual result inside an execution. The handler exports `PUT` only;
        earlier revisions of this document described a `POST`, which was never implemented.
      operationId: recordExecutionResult
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestExecutionResultInput"
      responses:
        "200":
          description: Recorded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordedExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/executions/automated:
    get:
      summary: List automated execution summaries
      description: Returns a bare array. Used by the composite-report picker.
      operationId: listAutomatedExecutions
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: suiteId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [in_progress, completed]
      responses:
        "200":
          description: Automated execution summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomatedExecutionSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/executions/counts:
    get:
      summary: Get execution counts
      description: Counts for the sidebar filters in the current project.
      operationId: getExecutionCounts
      tags:
        - Executions
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Execution counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionCounts"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/automated-results:
    post:
      summary: Report automated test results
      operationId: reportAutomatedResults
      tags:
        - Automated Results
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomatedResultsInput"
      responses:
        "200":
          description: Ingestion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomatedResultsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      summary: Read execution results for CI
      operationId: getAutomatedResults
      tags:
        - Automated Results
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: executionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution results
          content:
            application/json:
              schema:
