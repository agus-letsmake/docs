      summary: List attachments
      description: Requires exactly one of `testCaseId` or `executionResultId`.
      operationId: listAttachments
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: testCaseId
          in: query
          required: false
          schema:
            type: string
        - name: executionResultId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Register an already-uploaded attachment
      description: |
        Records metadata for a file the client uploaded to storage directly.
        Use `/api/attachments/upload` to upload the bytes through TestLab instead.
      operationId: createAttachment
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Registered attachment
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/attachments/upload:
    post:
      summary: Upload evidence for an execution
      operationId: uploadAttachment
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - executionId
              properties:
                file:
                  type: string
                  format: binary
                executionId:
                  type: string
                evidenceKind:
                  type: string
                  pattern: "^[a-z0-9-]{1,64}$"
                automationKey:
                  type: string
                  pattern: "^[A-Z0-9-]{1,64}$"
                retentionDays:
                  type: integer
      responses:
        "201":
          description: Uploaded attachment
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/attachments/{id}:
    get:
      summary: Get an attachment
      operationId: getAttachment
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Attachment
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete an attachment
      description: Returns the `storagePath` so the caller can delete the stored object.
      operationId: deleteAttachment
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  storagePath:
                    type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/evidence/v1/ingest:
    post:
      summary: Ingest an immutable case attempt with observed steps
      description: |
        Persists a run/case attempt and ordered step observations. Exactly one of `testCaseId`
        or `automationKey` is required. Replaying the same `idempotencyKey` with the same
        checksum returns the prior resource (`200` + `replayed: true`). A conflicting payload
        for an existing key returns `409`.
      operationId: ingestEvidenceCaseAttempt
      tags:
        - Evidence
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceIngestInput"
      responses:
        "200":
          description: Idempotent replay of an existing attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngestResponse"
        "201":
          description: Created attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/evidence/v1/results/{resultId}:
    get:
      summary: Get attempt/step/artifact metadata for an execution result
      description: |
        Returns chronological attempts, steps, and artifact metadata without binary URLs.
        Includes `defaultAttemptId` and `defaultStepId` for walkthrough selection.
      operationId: getEvidenceResult
      tags:
        - Evidence
      parameters:
        - $ref: "#/components/parameters/EvidenceResultId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Evidence tree for the execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResultResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/evidence/v1/steps/{stepId}/artifacts:
    post:
      summary: Upload a screenshot artifact for an observed step
      description: |
        Multipart upload of a step screenshot. Pilot MIME types are `image/png`, `image/jpeg`,
        and `image/webp` (max 20 MB). Replaying the same `idempotencyKey` for the same step
        returns the prior artifact (`200` + `replayed: true`).
      operationId: uploadEvidenceStepArtifact
      tags:
        - Evidence
      parameters:
        - $ref: "#/components/parameters/EvidenceStepId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - idempotencyKey
              properties:
                file:
                  type: string
                  format: binary
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 500
                captureAt:
                  type: string
                  format: date-time
                  description: Optional capture timestamp
      responses:
        "200":
          description: Idempotent replay of an existing artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceArtifactUploadResponse"
        "201":
          description: Uploaded artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceArtifactUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/evidence/v1/artifacts/{id}/access:
    get:
      summary: Get a short-lived signed URL for an evidence artifact
      description: |
        Returns a temporary download URL after project membership checks. Artifact records do
        not store permanent public URLs.
      operationId: getEvidenceArtifactAccess
      tags:
        - Evidence
      parameters:
        - $ref: "#/components/parameters/EvidenceArtifactId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Signed access URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceArtifactAccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/GoneError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/evidence/v1/artifacts/{id}/content:
    get:
      summary: Stream evidence artifact bytes through TestLab
      description: |
        Same-origin binary proxy for walkthrough progressive loading and private browser cache.
        Prefer `/access` when a signed storage URL is sufficient.
      operationId: getEvidenceArtifactContent
      tags:
        - Evidence
      parameters:
        - $ref: "#/components/parameters/EvidenceArtifactId"
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Artifact bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/GoneError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/audit-log:
    get:
      summary: Read the audit log
      description: Returns a bare array. `limit` is clamped to at most 100 and defaults to 50.
      operationId: listAuditLog
      tags:
        - Audit
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: entityId
          in: query
          required: false
          schema:
            type: string
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 50
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/stats/trends:
    get:
      summary: Execution pass-rate trends
      description: Returns a bare array of recent completed executions with pass-rate rollups.
      operationId: getExecutionTrends
      tags:
        - Statistics
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionTrend"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/stats/flaky:
    get:
      summary: Flaky test detection
      description: Returns a bare array, empty when there is not enough history.
      operationId: getFlakyTests
      tags:
        - Statistics
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      responses:
        "200":
          description: Flaky test cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlakyTestCase"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/import:
    post:
      summary: Import test data
      operationId: importData
      tags:
        - Data Management
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/export:
    get:
      summary: Export test data
      description: |
        `format=json` returns a JSON document as a file download. `format=csv` returns CSV and is
        only supported for `type=test-cases` and `type=executions`.
      operationId: exportData
      tags:
        - Data Management
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, test-cases, suites, executions]
            default: all
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDocument"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/reports/pdf:
    get:
      summary: Generate an execution PDF report
      operationId: generateExecutionReport
      tags:
        - Reports
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: executionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/reports/composite/pdf:
    get:
      summary: Generate a composite manual + automated PDF report
      operationId: generateCompositeReport
      tags:
        - Reports
      parameters:
        - $ref: "#/components/parameters/ProjectIdHeader"
        - name: manualExecutionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/sync:
    post:
      summary: Sync the signed-in Firebase user into TestLab
      description: |
        Upserts the user record and bootstraps a default project membership when the user has none.
        Requires a Firebase bearer token; API keys are not accepted.
      operationId: syncAuthUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                image:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Synced user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserReference"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/cli/device/code:
    post:
      summary: Start a CLI browser device-login session
      description: |
        Creates a pending device-login session for `testlab login`. Returns a `deviceCode` for the CLI
        to poll and a `userCode` / verification URL for the human to confirm in the browser after
        Google/Firebase sign-in. No authentication required.
      operationId: createCliDeviceCode
      tags:
        - CLI
      security: []
      responses:
        "201":
          description: Pending device-login session
          content:
            application/json:
              schema:
                type: object
                required:
                  - deviceCode
                  - userCode
                  - verificationUri
                  - verificationUriComplete
                  - expiresIn
                  - interval
                properties:
                  deviceCode:
                    type: string
                  userCode:
                    type: string
                    example: ABCD-EFGH
                  verificationUri:
                    type: string
                    format: uri
                  verificationUriComplete:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    description: Seconds until the pending session expires
                  interval:
                    type: integer
                    description: Suggested poll interval in seconds
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/cli/device/token:
    post:
      summary: Poll a CLI device-login session
      description: |
        Exchanges a `deviceCode` for a short-lived user credential once the human has approved the
        session in the browser. The credential is returned once (`status: complete`) and then marked
        consumed. Pending polls return `status: pending`.
      operationId: pollCliDeviceToken
      tags:
        - CLI
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceCode
              properties:
                deviceCode:
                  type: string
      responses:
        "200":
          description: Pending, denied, or completed device login
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [pending]
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [denied]
                  - type: object
                    required: [status, accessToken, tokenType, email, expiresAt]
                    properties:
                      status:
                        type: string
                        enum: [complete]
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                        enum: [api_key]
                      email:
                        type: string
                        format: email
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          description: Expired or already consumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [expired, consumed]
                  error:
                    type: string
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/cli/device/approve:
    post:
      summary: Approve or deny a CLI device-login user code
      description: |
        Completes a pending device-login session after the human signs in with Google/Firebase.
        On approve, mints a short-lived global API key used only as the CLI user credential
        (stored outside project `.env` by the CLI). Requires a Firebase bearer token — API keys
        are not accepted.
      operationId: approveCliDeviceLogin
      tags:
        - CLI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userCode
              properties:
                userCode:
                  type: string
                  example: ABCD-EFGH
                action:
                  type: string
                  enum: [approve, deny]
                  default: approve
      responses:
        "200":
          description: Approval or denial recorded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [approved, denied]
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dev/session:
    get:
      summary: Inspect or bootstrap a development session
      description: |
        Disabled in production (`403`). Without `browser=1`, reports whether the request carries a
        valid development session. With `browser=1` and the correct `secret`, provisions a dev API
        key, sets cookies, and redirects to `next`.
      operationId: getDevSession
      tags:
        - Development
      security: []
      parameters:
        - name: browser
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
        - name: secret
          in: query
          required: false
          schema:
            type: string
          description: Required when `browser=1`
        - name: next
          in: query
          required: false
          schema:
            type: string
            default: "/"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevSessionState"
        "307":
          description: Cookie bootstrap redirect (only when `browser=1`)
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Establish a development session
      description: |
        Disabled in production (`403`). Requires the `X-Dev-Session-Secret` header and a valid
        `apiKey` in the body. Sets the development session cookies.
      operationId: createDevSession
      tags:
        - Development
      security: []
      parameters:
        - name: X-Dev-Session-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKey
              properties:
                apiKey:
                  type: string
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserReference"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Clear the development session
      description: Disabled in production (`403`). Requires the `X-Dev-Session-Secret` header.
      operationId: deleteDevSession
      tags:
        - Development
      security: []
      parameters:
        - name: X-Dev-Session-Secret
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/cron/reconcile-executions:
    get:
      summary: Scheduled reconciliation of stale automated executions
      description: |
        Invoked by the platform scheduler. Authenticated with a cron secret bearer token,
        not an API key or Firebase token.
      operationId: cronReconcileExecutions
      tags:
        - Cron
      security:
        - CronSecretAuth: []
      responses:
        "200":
          description: Reconciliation summary
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                  - $ref: "#/components/schemas/ReconcileResult"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for CI/CD and external integrations
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token for user authentication
    CronSecretAuth:
      type: http
      scheme: bearer
      description: Shared cron secret, used only by scheduled jobs

  parameters:
    ProjectIdHeader:
      name: X-Project-Id
      in: header
      required: false
      schema:
        type: string
      description: |
        Selects the active project. When omitted the server falls back to the caller's oldest
        project membership, so machine clients should always send it explicitly.

    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    TestCaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Test case ID

    TestSuiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Test suite ID

    ExecutionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Test execution ID

    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Project ID

    AttachmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Attachment ID

    EvidenceArtifactId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Evidence artifact ID

    EvidenceStepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
      description: Step observation ID

    EvidenceResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
      description: Test execution result ID

    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Automation batch run ID

    IntegrationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Automation integration ID

    MappingId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Suite automation mapping ID

  schemas:
    UserReference:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
        image:
          type: string
          nullable: true
          description: Profile picture URL

    ProjectRole:
      type: string
      enum: [owner, editor, viewer]
      description: |
        Project membership role. `viewer` reads, `editor` adds test, suite, execution, result,
        evidence, and trigger writes, `owner` adds project, membership, key, and GitHub management.
        Source: `src/types/index.ts` and `research/mcp-server/auth-tenancy-safety.md` (Authorization mapping).

    ApiKeyScope:
      type: string
      enum: [global, project]
      description: |
        `project` keys are bound to a single project; `global` keys resolve the project from
        `X-Project-Id` or the caller's oldest membership. Source: `src/types/index.ts`.

    AutomationStatus:
      type: string
      enum: [not_automated, automated, will_not_automate]
      description: Source of truth is `AUTOMATION_STATUSES` in `src/types/index.ts`.

    Priority:
      type: string
      enum: [critical, high, medium, low]

    TestCaseAutomationRunner:
      type: string
      nullable: true
      enum: [playwright, maestro, both]
      description: Runner that covers this case. Test cases allow `both`; suites do not.

    SuiteAutomationRunner:
      type: string
      nullable: true
      enum: [playwright, maestro]
      description: Picks the CI workflow when triggering from Runs.

    AutomationKey:
      type: string
      nullable: true
      minLength: 1
      maxLength: 100
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      description: Stable external identifier used by CI to resolve a test case.

    TriggerableWorkflowId:
      type: string
      enum: [maestro-ios.yml, playwright-casa.yml]
      description: |
        The GitHub Actions workflow files TestLab is allowed to dispatch.
        Defined only in Zod (`src/lib/schemas.ts`); there is no matching TypeScript type.

    AutomationProvider:
      type: string
      enum: [webhook, github_actions, gitlab, jenkins, custom]
      description: |
        Only `github_actions` and `webhook` are exercised end to end today.
        See GAP-17 in `research/mcp-server/api-gaps.md`.

    ExecutionStatus:
      type: string
      enum: [todo, pass, fail, skipped, blocked]

    AutomatedResultStatus:
      type: string
      enum: [pass, fail, skipped, blocked]
      description: |
        Automated ingestion deliberately narrows `ExecutionStatus` by excluding `todo`:
        a runner reports an outcome, never a pending state.

    TestRunStatus:
      type: string
      enum: [in_progress, completed]

    ExecutionKind:
      type: string
      enum: [manual, automated]

    PageMeta:
      type: object
      description: Pagination fields returned by the current list endpoints. These do not include `hasMore`.
      required:
        - total
        - page
        - limit
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    TestCaseStep:
      type: object
      required:
        - id
        - description
        - expectedResult
      properties:
        id:
          type: string
        description:
          type: string
          maxLength: 2000
        expectedResult:
          type: string
          maxLength: 2000

    TestCase:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        preconditions:
          type: string
          nullable: true
        epicOrFeature:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TestCaseStep"
        labels:
          type: array
          items:
            type: string
        automationStatus:
          allOf:
            - $ref: "#/components/schemas/AutomationStatus"
          default: not_automated
        automationKey:
          $ref: "#/components/schemas/AutomationKey"
        automationRunner:
          $ref: "#/components/schemas/TestCaseAutomationRunner"
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          default: medium
        createdBy:
          $ref: "#/components/schemas/UserReference"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TestCaseInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 5000
        preconditions:
          type: string
          nullable: true
          maxLength: 5000
        epicOrFeature:
          type: string
          nullable: true
          maxLength: 500
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TestCaseStep"
        labels:
          type: array
          items:
            type: string
            maxLength: 100
        automationStatus:
          $ref: "#/components/schemas/AutomationStatus"
        automationKey:
          $ref: "#/components/schemas/AutomationKey"
        automationRunner:
          $ref: "#/components/schemas/TestCaseAutomationRunner"
        priority:
          $ref: "#/components/schemas/Priority"

    TestCaseUpdateInput:
      allOf:
        - $ref: "#/components/schemas/TestCaseInput"
      description: Same shape as `TestCaseInput`; every field except `title` is optional.

    TestCaseListPage:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TestCase"
        - $ref: "#/components/schemas/PageMeta"

    AutomationKeyResolution:
      type: object
      properties:
        projectId:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              automationKey:
                type: string
              testCaseId:
                type: string
                nullable: true
              found:
                type: boolean
        found:
          type: integer
        missing:
          type: array
          items:
            type: string

    TestSuite:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        automationRunner:
          $ref: "#/components/schemas/SuiteAutomationRunner"
        testCaseIds:
          type: array
          items:
            type: string
        createdBy:
          $ref: "#/components/schemas/UserReference"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TestSuiteInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 5000
        automationRunner:
          $ref: "#/components/schemas/SuiteAutomationRunner"
        testCaseIds:
          type: array
          items:
            type: string

    TestSuiteUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 5000
        automationRunner:
          $ref: "#/components/schemas/SuiteAutomationRunner"
        testCaseIds:
          type: array
          items:
            type: string

    TestSuiteListPage:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TestSuite"
        - $ref: "#/components/schemas/PageMeta"

    StepExecutionResult:
      type: object
      properties:
        stepId:
          type: string
        status:
          type: string
          enum: [todo, pass, fail]

    TestExecutionResult:
      type: object
      properties:
        testCaseId:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        notes:
          type: string
          nullable: true
        stepResults:
          type: array
          items:
            $ref: "#/components/schemas/StepExecutionResult"
        source:
          $ref: "#/components/schemas/ExecutionKind"
        duration:
          type: integer
          nullable: true
          description: Duration in milliseconds (for automated tests)
        errorMessage:
          type: string
          nullable: true
          description: Error message/stack trace (for automated tests)
        runnerEmail:
          type: string
          nullable: true
          description: Test account email used for this result (CI)
        runnerPersonaKey:
          type: string
          nullable: true
          description: Catalog persona key for this result (CI)
        attachmentCount:
          type: integer
        executedBy:
          $ref: "#/components/schemas/UserReference"
        executedAt:
          type: string
          format: date-time
          nullable: true

    TestExecutionResultInput:
      type: object
      required:
        - testCaseId
        - status
      properties:
        testCaseId:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        notes:
          type: string
        stepResults:
          type: array
          items:
            $ref: "#/components/schemas/StepExecutionResult"

    RecordedExecutionResult:
      type: object
      properties:
        success:
          type: boolean
        testCaseId:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        notes:
          type: string
          nullable: true
        stepResults:
          type: array
          items:
            $ref: "#/components/schemas/StepExecutionResult"
        executedBy:
          $ref: "#/components/schemas/UserReference"
        executedAt:
          type: string
          format: date-time
          nullable: true

    AutomatedResultItemInput:
      type: object
      required:
        - status
      description: Exactly one of `testCaseId` or `automationKey` must be present.
      properties:
        testCaseId:
          type: string
        automationKey:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        status:
          $ref: "#/components/schemas/AutomatedResultStatus"
        duration:
          type: integer
          minimum: 0
        errorMessage:
          type: string
          nullable: true
          maxLength: 10000
        notes:
          type: string
          nullable: true
          maxLength: 5000
        runnerEmail:
          type: string
          format: email
          nullable: true
        runnerPersonaKey:
          type: string
          nullable: true
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AutomatedResultAttachmentInput"

    AutomatedResultAttachmentInput:
      type: object
      required:
        - filename
        - storagePath
        - contentType
        - size
        - url
      properties:
        filename:
          type: string
          maxLength: 500
        storagePath:
          type: string
          maxLength: 2000
        contentType:
          type: string
          maxLength: 200
        size:
          type: integer
          minimum: 0
        url:
          type: string
          maxLength: 2000
        thumbnailUrl:
          type: string
          nullable: true
          maxLength: 2000

    RunnerContext:
      type: object
      nullable: true
      description: When present as an object, at least one of `target` or `manifestPath` is required.
      properties:
        target:
          type: string
          maxLength: 500
        manifestPath:
          type: string
          maxLength: 2000

    TestExecution:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TestRunStatus"
        kind:
          $ref: "#/components/schemas/ExecutionKind"
        suiteId:
          type: string
          nullable: true
        suiteName:
          type: string
          nullable: true
        createdBy:
          $ref: "#/components/schemas/UserReference"
        executedBy:
          $ref: "#/components/schemas/UserReference"
        executedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        gitSha:
          type: string
          nullable: true
          description: Git commit SHA (for automated executions)
        branch:
          type: string
          nullable: true
          description: Git branch name (for automated executions)
        ciRunUrl:
          type: string
          nullable: true
          description: URL to the CI pipeline run (for automated executions)
        buildNumber:
          type: string
          nullable: true
          description: CI build number (for automated executions)
        runnerContext:
          $ref: "#/components/schemas/RunnerContext"
        pairedAutomatedExecutionId:
          type: string
          nullable: true
          description: ID of the paired automated execution (for composite reports)
        pairedAutomatedExecution:
          $ref: "#/components/schemas/PairedExecutionReference"
        testResults:
          type: array
          items:
            $ref: "#/components/schemas/TestExecutionResult"

    TestExecutionListPage:
      type: object
      allOf:
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TestExecution"
        - $ref: "#/components/schemas/PageMeta"

    PairedExecutionReference:
      type: object
      nullable: true
      description: Lightweight reference to a paired automated execution
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TestRunStatus"
        executedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        gitSha:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        ciRunUrl:
          type: string
          nullable: true
        buildNumber:
          type: string
          nullable: true

    AutomatedExecutionSummary:
      type: object
      description: Lightweight execution summary for the automated execution picker
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TestRunStatus"
        executedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        gitSha:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        ciRunUrl:
          type: string
          nullable: true
        buildNumber:
          type: string
          nullable: true
        stats:
          $ref: "#/components/schemas/ResultStatusSummary"

    ResultStatusSummary:
      type: object
      properties:
        total:
          type: integer
        pass:
          type: integer
        fail:
          type: integer
        skipped:
          type: integer
        blocked:
          type: integer
        todo:
          type: integer

    ExecutionCounts:
      type: object
      properties:
        all:
          type: integer
        manual:
          type: integer
        automated:
          type: integer
        in_progress:
          type: integer
        completed:
          type: integer

    TestExecutionInput:
      type: object
      required:
        - suiteId
        - suiteName
        - testCaseIds
      properties:
        suiteId:
          type: string
        suiteName:
          type: string
        testCaseIds:
          type: array
          minItems: 1
          items:
            type: string
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true

    TestExecutionUpdateInput:
      type: object
      description: Every field is optional; only supplied fields are written.
      properties:
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TestRunStatus"
        runnerContext:
          $ref: "#/components/schemas/RunnerContext"
        pairedAutomatedExecutionId:
          type: string
          nullable: true

    AutomatedResultsInput:
      type: object
      properties:
        executionId:
          type: string
          description: Existing execution ID to update (mutually exclusive with suiteId)
        suiteId:
          type: string
          description: Suite ID to create new execution for (omit for ad hoc execution)
        suiteName:
          type: string
          nullable: true
          description: Suite name (fetched automatically if suiteId is provided; optional label for ad hoc runs)
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        gitSha:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        ciRunUrl:
          type: string
          nullable: true
          format: uri
        buildNumber:
          type: string
          nullable: true
        autoComplete:
          type: boolean
          default: false
        runnerContext:
          $ref: "#/components/schemas/RunnerContext"
        results:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/AutomatedResultItemInput"

    AutomatedResultsStartInput:
      type: object
      properties:
        suiteId:
          type: string
        suiteName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true
        gitSha:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        ciRunUrl:
          type: string
          nullable: true
          format: uri
        buildNumber:
          type: string
          nullable: true
        batchId:
          type: string
          nullable: true
          description: Optional AutomationBatchRun id (must match batchItem when both set)
        batchItemId:
          type: string
          nullable: true
          description: AutomationBatchItem id from workflow input testlab_batch_item_id
        runnerContext:
          $ref: "#/components/schemas/RunnerContext"

    AutomatedResultsStartResponse:
      type: object
      properties:
        success:
          type: boolean
        executionId:
          type: string
        executionStatus:
          $ref: "#/components/schemas/TestRunStatus"
        seededCount:
          type: integer
        batchItemId:
          type: string
          nullable: true
        runnerContext:
          $ref: "#/components/schemas/RunnerContext"

    AutomatedResultsReconcileInput:
      type: object
      properties:
        executionId:
          type: string
        staleMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        force:
          type: boolean
          description: With `executionId`, skips the stale-window check

    ReconcileResult:
      type: object
      properties:
        staleMinutes:
          type: integer
        cutoff:
          type: string
          format: date-time
        reconciled:
          type: array
          items:
            type: object
            properties:
              executionId:
                type: string
              closedResults:
                type: integer
        skipped:
          type: array
          items:
            type: object
            properties:
              executionId:
                type: string
              reason:
                type: string

    AutomatedResultsReconcileResponse:
      allOf:
        - type: object
          properties:
            success:
              type: boolean
        - $ref: "#/components/schemas/ReconcileResult"

    AutomationTriggerInput:
      type: object
      required:
        - workflowIds
      properties:
        environment:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        buildLabel:
          type: string
          nullable: true
        failFast:
          type: boolean
          default: false
        workflowIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TriggerableWorkflowId"
        idempotencyKey:
          type: string
          maxLength: 200

    AutomationBatchItem:
      type: object
      properties:
        id:
          type: string
        batchRunId:
          type: string
        suiteId:
          type: string
        suiteName:
          type: string
        integrationId:
          type: string
        status:
          type: string
          enum: [pending, triggered, failed]
        providerRef:
          type: string
          nullable: true
        executionId:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        triggeredAt:
          type: string
          format: date-time
          nullable: true

    AutomationBatchRun:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, partial]
        runConfig:
          type: object
        totalCount:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
        triggeredAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutomationBatchItem"

    AutomationBatchRetryResult:
      allOf:
        - $ref: "#/components/schemas/AutomationBatchRun"
        - type: object
          properties:
            retrySuccessCount:
              type: integer
            retryFailureCount:
              type: integer

    AutomationPreflightResult:
      type: object
      properties:
        ready:
          type: boolean
          description: True when the GitHub App is configured, a repo is bound, and at least one workflow is ready
        githubBound:
          type: boolean
        githubAppConfigured:
          type: boolean
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/AutomationPreflightWorkflow"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/AutomationPreflightIssue"

    AutomationPreflightWorkflow:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/TriggerableWorkflowId"
        name:
          type: string
        description:
          type: string
        ready:
          type: boolean
        suiteId:
          type: string
          nullable: true
        suiteName:
          type: string
          nullable: true
        issue:
          type: string
          nullable: true

    AutomationPreflightIssue:
      type: object
      properties:
        suiteId:
          type: string
        suiteName:
          type: string
        issue:
          type: string

    AutomationIntegration:
      type: object
      description: "`webhookSecret` is deliberately never returned."
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        provider:
          $ref: "#/components/schemas/AutomationProvider"
        webhookUrl:
